[pytest]
testpaths = tests
pythonpath = .
addopts = -x --timeout=30 --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning:ui.components
    ignore::DeprecationWarning:pkg_resources
    ignore::UserWarning:urllib3
    # macOS Accelerate BLAS sets FPE flags on finite matmul outputs (numpy/numpy#27282).
    # Verified spurious — einsum gives identical finite results with no warnings.
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
