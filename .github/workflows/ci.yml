name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-timeout ruff

      - name: Ruff
        run: ruff check ui/styles.py ui/components.py data/quality.py engine/cointegration.py state/ tools/ tests/

      - name: Pytest
        run: pytest --cov=data.quality --cov=state --cov=ui.styles --cov=tools.styles_audit --cov=engine.cointegration
