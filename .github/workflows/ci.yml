# CI — runs the full pytest suite + consolidated backtest health gate on
# every push and PR.
#
# Purpose: lock in the ~5,650-test safety net so a regression never
# reaches main unseen, and gate the analytical layer's roll-up flags
# via tools.backtests --strict (8 validators must all read healthy).
#
# Defaults from pytest.ini are honored (-x --timeout=30 --strict-markers -q),
# so this workflow does not pass --override-ini. If a test fails, the
# job stops at the first failure (per the -x default) and the run is red.
#
# Coverage is collected across the whole repo and uploaded as an
# artifact so contributors can inspect it without re-running locally.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # 15 min: the full ~7,150-test suite + coverage + backtest gate + the
    # scikit-learn install. The whole suite (no early -x exit on green) runs
    # ~9-10 min with coverage, so 10 was still timing out; 15 gives headroom.
    # (Per-test --timeout=30 from pytest.ini still bounds any single hang.)
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-cov

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: Run consolidated backtest health gate (strict)
        # All 9 validators must report healthy on the bundled synth;
        # --strict exits 1 on any unhealthy flag. The synth-driven
        # property tests already cover the same surface inside pytest
        # above, so this gate is mostly belt-and-suspenders + a
        # human-readable snapshot in the CI log for triage.
        run: python -m tools.backtests --format text --strict

      - name: Run baseline drift gate
        # Sharper than --strict — catches numeric drift in either
        # direction (e.g. chokepoint sign-agreement moves from 80.5%
        # → 65%: still above the 0.55 healthy threshold so --strict
        # accepts, but baseline-compare flags the 15.5pp regression).
        # Per-metric tolerances live in tools/backtests.py
        # (_DRIFT_TOLERANCE: ±5pp on rates, ±1.0d on MAEs).
        run: python -m tools.backtests --compare-baseline docs/backtest-baseline.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
